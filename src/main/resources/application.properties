spring.application.name=airplanner

# A wide search fans out over many routes; give it room before the browser gives up.
server.tomcat.connection-timeout=120s
spring.mvc.async.request-timeout=180s

# Ryanair market and how long fare responses stay cached on disk (~/.airplanner/cache).
airplanner.market=en-gb
airplanner.fare-cache-ttl=30m
airplanner.cache=true
airplanner.max-refine=400

# One-click "Fly from" chips on the page: the airports you would actually drive to.
airplanner.home-airports=BRQ,VIE,PRG,OSR,BTS,KRK,KTW,WRO

# Templates are re-read on every request in development.
spring.thymeleaf.cache=false

# Optional Duffel exact-date search. No external call until enabled with a matching token.
airplanner.duffel.enabled=${DUFFEL_ENABLED:false}
airplanner.duffel.live=${DUFFEL_LIVE:false}
airplanner.duffel.token=${DUFFEL_ACCESS_TOKEN:}
airplanner.duffel.daily-limit=20
airplanner.duffel.monthly-limit=500
